name: Refresh thrift store data

# Weekly: classified thrift/resale sources plus Census scoring.
# Published ATP extracts and official retail locators; no runtime Overpass dependency.
# Invalid source partitions or coverage regressions preserve the published file.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch: {}

concurrency:
  group: refresh-goodwill-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - name: Record confirmed public coverage
        run: node --import tsx scripts/check-google-coverage.ts --write-baseline /tmp/thriftly-coverage.json
      - name: Restore recent state checkpoints
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/atp
            .cache/expanded
            .cache/store-access
          key: thrift-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: thrift-
      - name: Fetch latest successful published Goodwill source
        id: source
        run: node --import tsx scripts/fetch-atp-goodwill.ts
      - name: Build national Goodwill dataset
        if: steps.source.outputs.changed == 'true'
        run: npm run build:data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          STORE_SOURCE: atp
      - name: Fetch other thrift and resale sources
        run: node --import tsx scripts/fetch-expanded-stores.ts
      - name: Build combined store registry
        run: node --import tsx scripts/build-expanded-stores.ts
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      - name: Join published EPA walkability data
        run: node --import tsx scripts/fetch-store-access.ts
      - name: Resolve new or changed Google identities
        run: node --import tsx scripts/match-google-places.ts
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - name: Preserve coverage on unexpected matching regressions
        run: node --import tsx scripts/check-google-coverage.ts --baseline /tmp/thriftly-coverage.json
      - run: npm test
      - name: Save checkpoints even when upstream is unavailable
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/atp
            .cache/expanded
            .cache/store-access
          key: thrift-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
      - name: Save validated dataset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goodwill-dataset
          path: |
            data/goodwill-us.json
            data/stores-us.json
            data/store-access.json
            data/google-place-ids.json
            data/provenance/*.json
          retention-days: 7
      - name: Commit refreshed data
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/goodwill-us.json data/stores-us.json data/store-access.json data/google-place-ids.json data/provenance
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: weekly thrift store data refresh"
            # main may have moved while the (long) build ran, so rebase our data
            # commit on top of the latest main before pushing. Retry a few times
            # in case more commits land during the rebase.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push attempt $i failed; retrying in 5s"
              sleep 5
            done
            echo "could not push after retries" >&2
            exit 1
          fi
