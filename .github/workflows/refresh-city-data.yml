name: Refresh Goodwill data

# Weekly: per-state Overpass queries for every US Goodwill store (retried, mirror
# fallback), scored offline against bundled Census data, written to
# data/goodwill-us.json. Commits any change, which auto-deploys via Vercel and
# re-pre-renders. No request-time upstream calls on the default path.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch: {}

concurrency:
  group: refresh-goodwill-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - name: Restore recent state checkpoints
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/refresh
          key: refresh-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: refresh-
      - name: Build national Goodwill dataset
        run: npm run build:data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          OVERPASS_URL: ${{ secrets.OVERPASS_URL }}
      - name: Save checkpoints even when upstream is unavailable
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/refresh
          key: refresh-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
      - name: Save validated dataset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goodwill-dataset
          path: data/goodwill-us.json
          retention-days: 7
      - name: Commit refreshed data
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/goodwill-us.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: weekly Goodwill data refresh"
            # main may have moved while the (long) build ran, so rebase our data
            # commit on top of the latest main before pushing. Retry a few times
            # in case more commits land during the rebase.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push attempt $i failed; retrying in 5s"
              sleep 5
            done
            echo "could not push after retries" >&2
            exit 1
          fi
